# The end-to-end suite.
#
# Everything that writes runs on a fresh anvil with the contracts built from
# fangorn-network/contracts and deployed there, so a run leaves nothing anywhere.
# Storage is in memory. The real chain is only read (src/e2e/live.e2e.test.ts).
#
# It holds no secrets: every wallet, the admin included, is anvil's.
# - Actions are pinned to a commit, and the install is frozen to the lockfile and
#   runs no package scripts.

name: E2E

on:
  push:
    branches:
      - main
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (anvil)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The contracts the suites deploy. Point `ref` at the contracts this SDK targets.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: fangorn-network/contracts
          path: contracts
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.21.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # anvil and forge.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      # Not `pnpm test:e2e`: that reads a .env file, and there is none here.
      - run: pnpm exec vitest run --config vitest.e2e.config.ts
        env:
          FANGORN_CONTRACTS_DIR: ${{ github.workspace }}/contracts/solidity
