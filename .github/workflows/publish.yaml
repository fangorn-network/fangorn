# Publishes to npm on every merge to main, if package.json's version is not
# already on npm. Bump the version in the PR to release; otherwise this is a no-op.
# Auth is npm Trusted Publishing (OIDC): no token. Configure it on npmjs.com under
# the package's settings -> Trusted Publisher -> GitHub Actions, workflow publish.yaml.

name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

concurrency: publish

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - id: check
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@fangorn-network/sdk@$v" version >/dev/null 2>&1; then
            echo "v$v already published, skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$v" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish
        run: pnpm build
      - if: steps.check.outputs.publish
        # trusted publishing needs npm >= 11.5.1; node 22 ships npm 10. Provenance is automatic.
        run: |
          npm install -g npm@^11.5.1
          npm publish --access public

  # Opens (or refreshes) a PR in westmarch bumping the SDK to what was just published.
  # GITHUB_TOKEN can't write to another repo, so this mints a short-lived token from a
  # GitHub App installed on westmarch (Contents + Pull requests: read/write).
  # Needs repo variable WESTMARCH_APP_ID and secret WESTMARCH_APP_PRIVATE_KEY.
  bump-westmarch:
    name: Bump SDK in westmarch
    needs: publish
    if: needs.publish.outputs.version
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.publish.outputs.version }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WESTMARCH_APP_ID }}
          private-key: ${{ secrets.WESTMARCH_APP_PRIVATE_KEY }}
          owner: fangorn-network
          repositories: westmarch
      - uses: actions/checkout@v4
        with:
          repository: fangorn-network/westmarch
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          # the registry can lag a fresh publish by a minute or so
          for i in $(seq 1 10); do
            npm view "@fangorn-network/sdk@$V" version && break
            sleep 15
          done
          npm install --ignore-scripts "@fangorn-network/sdk@^$V"
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          branch="bump-sdk-v$V"
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Bump @fangorn-network/sdk to $V"
          git push --force origin "$branch"
          gh pr view "$branch" >/dev/null 2>&1 || gh pr create --head "$branch" \
            --title "Bump @fangorn-network/sdk to $V" \
            --body "Automated: fangorn-network/fangorn published v$V ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)."
