jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - run: pnpm build
      - run: node lib/index.js
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - run: pnpm lint
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - run: pnpm format --list-different
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - run: pnpm run test --coverage
      - if: always()
        uses: codecov/codecov-action@v3
  admin_fork:
    # The protocol admin suite, against the contracts built from source and
    # deployed on a fresh anvil. It needs no secrets, so it can run on every
    # pull request.
    name: Admin (fork)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: fangorn-network/contracts
          path: contracts
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm test:admin
        env:
          FANGORN_CONTRACTS_DIR: ${{ github.workspace }}/contracts/solidity
  live_reads:
    # Read-only checks of the deployed contracts and the public RPC. No secrets.
    name: Live reads (Arbitrum Sepolia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - run: pnpm test:live
  type_check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - run: pnpm tsc


name: CI


on:
  pull_request: ~
  push:
    branches:
      - main
